<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>string operation</title>
</head>
<body>
    <script>
        let str="Hello sachu";
        document.write("string:"+str+"<br>");
        document.write("length:"+str.length+"<br>");
        document.write("character at position:"+str.charAt(1)+"<br>");
        document.write("index of a string:"+str.indexOf("l")+"<br>");
        document.write("upper case:"+str.toUpperCase()+"<br>");
        document.write("lower case:"+str.toLowerCase()+"<br>");
        document.write("substring:"+str.substring(1,4)+"<br>");
        document.write("replace the element:"+str.replace("H","N")+"<br>");

    </script>
    
</body>
</html>
