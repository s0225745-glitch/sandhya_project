<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>frame and iframe demo</title>
    <style>
        body
        { 
            margin:0;
            display:flex;
            height:100vh;
            font family:arial,sanserif;
        }
        menu{
            width:25%;
            background-color:#f2f2f2;
            padding:20px;
            box-sizing:border-box;

        }
        menu a{
            display: block;
            margin: 15px 0;
            text-decoration: none;
            color:blue;
            font-size:18px;
        
        }
        .content{
            width:75%;

        }
        inframe{
            width:100%;
            height:100%;
            border:none;

        }
    </style>
</head>
<body>
    <div class="menu">
     <h2>navigation</h2>

     <a href="https://www.google.com" target="frame">google</a>
     <a href="https://www.wikipedia.org" target="frame">wikipedia</a>
     <a href="https://www.w3schools.com" target="frame">w3schools</a>

</div>
<div class="content">
    <iframe name="frame" src="about:blank"></iframe>
</div>
</body>
</html>
