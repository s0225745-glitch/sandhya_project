<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>

<body>

    {
        font-family:Arial,sans-serif;
        background:#f2f2f2;
        text-align:center;
    }

    .container{
        width: 350px;
        margin: 50px auto;
        background: white;
        padding: 20px;
        bord="taskList"></ul>
</div>    er-radius: 10px;
    }

    input{
        width: 70%;
        padding: 8px;
    }
    button{
        padding: 8px 12px;
        cursor: pointer;
    }

    ul{
        list-style:none;
        padding: 0;
    }

    li{
        background: #eee;
        margin: 10px 0;
        padding: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .completed{
        text-decoration: line-through;
        color: gray;
    }

    .delete {
        background: red;
        color: white;
        border: none;
        padding: 5px 8px;
    }
</style>
</head>

<body>

<div class="container">
    <h2>To-Do List</h2>

    <input type="text" id="taskinput"
    placeholder="Enter a task">
    <button onclick="addTask()">Add</button>

    <ul id="taskList"></ul>
</div> 

<script>
function addTask() {
    let input=
 document.grtElementById("taskinput");
    let task = input.value;

    if(task =="") {
        alert("Please enter a task");
        return;
    }

    let li = document.createElement("li");

    let span = document.createElemnent("span");
    span.innerText = task;

    span onclick = function() {
        span.classList.toggle("completed");
    };
    let delBtn = document.createElement("button");
    delBtn.innerText = "Delete";
    delBtn.className = "delete";

    delBtn.onclick = function() {
        li.remove();
    };

    li.appendChild(span);
    li.appendChild(delBtn);

    document.getElementById("taskList").appendChild(li);

    input.value = "";

}
</script>


</body>
</html>
