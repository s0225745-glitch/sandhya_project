<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css border property demo</title>
    <style>
        body{
            font-family:arial,sens-serif;
            margin:20px;
        }
        h1{
            text-align:center;
        }
        .box{
            width:300px;
            padding:15px;
            manrin:15px;
        }
        .solid{
            border:3px solid blue;

        }
        .dotted{
            border:4px dotted green;
        }
        .dashed{
            border:5px dashed red;
        }
        .double{
            border:6px double purple;
        }
        .groove{
            border:8px groove orange;
        }
        .card{
            width:320px;
            padding:20;
            margin:20;
            border:3px solid black;
            border-radius:20px;
            box-shadow:2px 2px 10px gray;
        }
    </style>
</head>
<body>
    <h1>css border properties demonstration</h1>
    <div class="box solid"> 
        solid border(3px,blue)
    </div>
    <div class="box dotted"> 
        dotted border(4px,green)
    </div>
    <div class="box dashed">
        dashed border(5px,red)
    </div>
    <div class="box double">
        double border(6px,purple)
    </div>
    <div class="box groove">
        groove border(8px,orange)
    </div>
    <div class="card">
        <h2>rounded corner card</h2>
        <p><this card demonstrates the use of <strong> border radius</strong> to rounded corners.
        </p>
    </div>
    
</body>
</html>
